<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rem 布局方案</title>
  <style>
    img {
      width: 100%;
    }

    body {
      font-size: 16px;
    }

    .tabbar-layout {
      position: fixed;
      bottom: 0;
      left: 0;
      box-shadow: 0 -4px 4px rgba(0, 0, 0, 0.15);
      /* width: 100%;
      height: 48px; */
      /* width: 750px;
      height: 96px; */

      width: 100%;
      height: 9.6rem;
      height: 9.6rem;
    }
  </style>
  <style>

  </style>
  <script>
    {
      const docEl = document.documentElement;
      const setHtmlFontSize = () => {
        const viewWidth = docEl.clientWidth;
        const htmlFontSize = viewWidth / 75
        console.log(htmlFontSize);

        docEl.style.fontSize = htmlFontSize + 'px';
      }
      setHtmlFontSize();
      window.addEventListener('resize', setHtmlFontSize);
    }
  </script>
</head>

<body>
  <p>段落</p>
  <div class="tabbar-layout">
    <img src="./tabbar.png" alt="标签栏" />
  </div>
</body>

</html>
