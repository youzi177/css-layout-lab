  <title>VW 布局方案</title>
  <style>
    img {
      width: 100%;
    }

    body {
      font-size: 16px;
    }

    .tabbar-layout {
      position: fixed;
      bottom: 0;
      left: 0;
      box-shadow: 0 -.4rem .4rem rgba(0, 0, 0, 0.15);

      /* width: 100%;
      height: 48px; */
      width: 100vw;
      height: 12.8vw;
    }
  </style>
  <style>

  </style>
  <script>
    // 计算vw单位的值，以750px为基准
    // 100vw = 750px
    // 测量的ox/750px(基准) = ?VW/100vw
    // ?VW = (测量的px/750px(基准)) * 100vw
  </script>
</head>

<body>
  <p>段落</p>
  <div class="tabbar-layout">
    <img src="./tabbar.png" alt="标签栏" />

</html>
