<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../../styles/reset.css" />
  <title>em相对单位</title>
  <style>
    .box {
      font-size: 10px;
    }

    .box1 {
      font-size: 1em;
      background-color: antiquewhite;
      /* 相对自身字体，所以这里时100px */
      width: 10em;
      height: 10em
    }

    .box-name {
      /* 缩进两个字符 也是相对于自身的字体大小缩进*/
      text-indent: 2em;
      /* 可以把以下注释打开，就可以证明相对于自身的字体大小缩进 */
      /* font-size: 2em; */
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="box1">box1</div>
    <p>我是段落我是段落我是段落</p>
    <p class="box-name">我是段落</p>
    <p>我是段落</p>
  </div>
  <script>
    // em相对单位
    // 设置字体大小时，em单位相对于父元素的font-size
    // 设置其他，比如宽高时，1em=自身的字体大小
    //一般控制行的缩进，不用来布局 
  </script>
</body>

</html>
