<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rem相对单位</title>
  <link rel="stylesheet" href="../../../styles/reset.css" />
  <style>
    html {
      font-size: 16px;
    }

    .box {
      width: 10rem;
      height: 10rem;
      background-color: #ccc;
    }
  </style>
</head>

<body>
  <div class="box">box</div>
  <script>
    // rem 相对单位可以用来布局，相对于根元素（html）的字体大小来计算需要使用js
    // rem 是相对于根元素（html）的字体大小来计算的
  </script>
</body>

</html>
